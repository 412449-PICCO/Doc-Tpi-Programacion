openapi: 3.0.3
info:
  title: llm-service — Moderación de chat (EP-08)
  version: 1.1.0
  description: |
    Contrato del API de moderación implementado en `llm-service` (EP-08). Reemplaza al borrador
    `llm-service-v1-moderacion-borrador.yaml` (que describía `/ai/moderador`, ya inexistente).
    Los ejemplos son respuestas capturadas del servicio real (salvo `pendingTimeout`, ilustrativo).

    **Flujo:** `chat-service` pide una decisión síncrona (`POST /decisions`) ANTES de entregar el
    mensaje. Si es `BLOCK` se abre un incidente; el alumno puede apelar (`POST /appeals`) y el
    docente del curso lo revisa y resuelve (`POST /incidents/{id}/resolve`).
    `PENDING` y `PENDING_REVIEW` = el mensaje NO se publica hasta que un docente lo revise.

    **Cambio v1.1.0 (breaking, acordado con chat):** `sender_id` es obligatorio en
    `POST /decisions`. Sin él no se puede registrar de quién es el incidente ni validar que solo
    su dueño apele (anti-IDOR).

    **Autenticación:** este servicio NO valida JWT; confía en los headers `X-*` que inyecta el
    API Gateway (DEC-08). Para probar directo contra el servicio usar esos headers (ver `securitySchemes`).

    **Rutas:** todas también existen bajo el prefijo del Gateway `/api/llm` (ej. `/api/llm/moderation/v1/decisions`).
servers:
  - url: http://localhost:8086
    description: llm-service directo (overlay compose.debug.yaml)
  - url: http://localhost:4011
    description: Mock Prism (ver docs/contracts/MOCK.md)
tags:
  - name: Decisiones
  - name: Apelaciones
  - name: Incidentes (docente)
  - name: Retención (admin)
security:
  - GatewayHeaders: []
paths:
  /moderation/v1/decisions:
    post:
      tags: [Decisiones]
      operationId: decidirModeracion
      summary: Decide ALLOW / BLOCK / PENDING antes de entregar un mensaje (chat-service)
      description: |
        Requiere principal de **servicio** con scope `moderation:decide`. Idempotente por `message_id`:
        reenviarlo devuelve la decisión original aunque cambie el texto (la discrepancia se alerta en logs).
        Timeout interno 800 ms: si vence responde `PENDING` y el chat NO debe publicar. Nunca se aprueba
        automáticamente un mensaje que no pudo verificarse.
      parameters:
        - $ref: '#/components/parameters/PrincipalType'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/ServiceScopes'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerationDecisionRequest' }
            examples:
              limpio:
                value:
                  message_id: msg-001
                  course_id: curso-42
                  sender_id: alumno-1
                  sender_role: student
                  text: Hola profe, cuando es la entrega?
              spam:
                value:
                  message_id: msg-002
                  course_id: curso-42
                  sender_id: alumno-1
                  sender_role: student
                  text: mira http://a.com http://b.com http://c.com ya
      responses:
        '200':
          description: Decisión emitida (o recuperada por idempotencia)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationDecisionResponse' }
              examples:
                allow:
                  value: { message_id: msg-001, decision: ALLOW, reason_code: CLEAN, classifier_used: deterministic, latency_ms: 3, incident_id: null }
                block:
                  value: { message_id: msg-002, decision: BLOCK, reason_code: SPAM, classifier_used: deterministic, latency_ms: 1, incident_id: eee5cf4d-2903-42dd-bcc8-fead34b06450 }
                pendingReviewDegradado:
                  summary: Clasificador contextual caído (modo degradado)
                  value: { message_id: msg-009, decision: PENDING_REVIEW, reason_code: NEEDS_REVIEW, classifier_used: fallback, latency_ms: 599, incident_id: d2097bef-cd56-425a-a3ff-415b00bbfff9, degradation_reason: CONTEXTUAL_UNAVAILABLE }
                pendingTimeout:
                  value: { message_id: msg-010, decision: PENDING, reason_code: ENGINE_UNAVAILABLE, classifier_used: fallback, latency_ms: 801, incident_id: 7d6f0a9e-1b2c-4d3e-8f40-5a6b7c8d9e01, degradation_reason: FULL_ENGINE_UNAVAILABLE }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /moderation/v1/decisions/{message_id}:
    delete:
      tags: [Decisiones]
      operationId: retirarDecision
      summary: Intento de retirar una decisión (CA_negativo_1 de LLM-S11-H01)
      description: |
        Un `ALLOW` nunca abre incidente, por lo que jamás pasó por revisión explícita: retirarlo es un
        **error de protocolo** (`409`, se registra `PROTOCOL_VIOLATION`). Cualquier otra decisión solo puede
        retirarse si existe una resolución docente registrada; si no, también `409`. `204` si está autorizado.
      parameters:
        - { name: message_id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/PrincipalType'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/ServiceScopes'
      responses:
        '204': { description: Retiro autorizado tras revisión explícita }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No existe decisión para ese message_id }
        '409': { description: PROTOCOL_VIOLATION — ALLOW o sin revisión explícita previa }
  /moderation/v1/appeals:
    post:
      tags: [Apelaciones]
      operationId: crearApelacion
      summary: El alumno apela un incidente BLOCK propio
      description: Requiere principal de **usuario** (`X-User-Id`). Solo el dueño del incidente (el `sender_id` de la decisión) puede apelar.
      parameters:
        - $ref: '#/components/parameters/PrincipalType'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRoles'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAppealRequest' }
            example:
              incident_id: eee5cf4d-2903-42dd-bcc8-fead34b06450
              appeal_reason: Era un mensaje legitimo con enlaces de la catedra.
      responses:
        '201':
          description: Apelación creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appeal' }
              example:
                appeal_id: 46df5d9d-6272-4e6e-ac0f-ccc3bd67808f
                incident_id: eee5cf4d-2903-42dd-bcc8-fead34b06450
                user_id: alumno-1
                appeal_reason: Era un mensaje legitimo con enlaces de la catedra.
                status: PENDING_REVIEW
                created_at: '2026-09-18T20:51:03.404426145Z'
                updated_at: '2026-09-18T20:51:03.404426145Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ya existe una apelación para ese incidente
          content:
            application/json:
              example: { type: about:blank, title: Conflict, status: 409, detail: appeal_already_exists, error: appeal_already_exists }
        '422':
          description: El incidente no está en estado BLOCK (ej. ya resuelto o PENDING_REVIEW)
          content:
            application/json:
              example: { type: about:blank, title: Unprocessable Entity, status: 422, detail: Solo se pueden apelar incidentes en estado BLOCK }
  /moderation/v1/appeals/{appealId}:
    get:
      tags: [Apelaciones]
      operationId: consultarApelacion
      summary: El alumno consulta el estado de su apelación
      parameters:
        - $ref: '#/components/parameters/PrincipalType'
        - $ref: '#/components/parameters/UserId'
        - name: appealId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Apelación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appeal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /moderation/v1/incidents:
    get:
      tags: [Incidentes (docente)]
      operationId: listarIncidentes
      summary: El docente lista incidentes de su curso (paginado, máx. 50)
      description: '`status=PENDING_REVIEW` (default) incluye incidentes `BLOCK` y `PENDING_REVIEW` sin resolver. Un curso ajeno da 403 y nunca filtra datos.'
      parameters:
        - $ref: '#/components/parameters/PrincipalType'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRoles'
        - $ref: '#/components/parameters/TeacherCourseIds'
        - { name: course_id, in: query, required: true, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, default: PENDING_REVIEW, enum: [PENDING_REVIEW, BLOCK, CONFIRMED, REVERSED] } }
        - { name: page, in: query, schema: { type: integer, default: 0, minimum: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 50 } }
      responses:
        '200':
          description: Página de incidentes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentPage' }
              example:
                content:
                  - incident_id: eee5cf4d-2903-42dd-bcc8-fead34b06450
                    message_preview: mira http://a.com http://b.com http://c.com ya
                    reason_code: SPAM
                    decision: BLOCK
                    created_at: '2026-09-18T20:51:02.857527Z'
                    has_appeal: true
                    appeal_reason: Era un mensaje legitimo con enlaces de la catedra.
                    course_id: curso-42
                    status: BLOCK
                page: 0
                size: 20
                total_elements: 1
                total_pages: 1
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /moderation/v1/incidents/{incidentId}:
    get:
      tags: [Incidentes (docente)]
      operationId: detalleIncidente
      summary: Detalle de un incidente (texto del mensaje bloqueado, sin historial del chat)
      description: Si el incidente fue purgado por retención, `content` viene nulo/omitido.
      parameters:
        - $ref: '#/components/parameters/PrincipalType'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRoles'
        - $ref: '#/components/parameters/TeacherCourseIds'
        - { name: incidentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Detalle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentDetail' }
              example:
                incident_id: eee5cf4d-2903-42dd-bcc8-fead34b06450
                reason_code: SPAM
                resolution: REVERSED
                created_at: '2026-09-18T20:51:02.857527Z'
                content: mira http://a.com http://b.com http://c.com ya
                course_id: curso-42
                status: REVERSED
                has_appeal: true
                appeal_reason: Era un mensaje legitimo con enlaces de la catedra.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /moderation/v1/incidents/{incidentId}/resolve:
    post:
      tags: [Incidentes (docente)]
      operationId: resolverIncidente
      summary: El docente confirma o revierte el bloqueo (auditado, `resolved_by` nunca anónimo)
      parameters:
        - $ref: '#/components/parameters/PrincipalType'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRoles'
        - $ref: '#/components/parameters/TeacherCourseIds'
        - { name: incidentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveRequest' }
            example: { resolution: REVERSED, resolution_reason: 'Los enlaces eran material de la catedra, falso positivo.' }
      responses:
        '200':
          description: Incidente resuelto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resolution' }
              example:
                incident_id: eee5cf4d-2903-42dd-bcc8-fead34b06450
                resolution: REVERSED
                resolved_by: doc-1
                resolution_reason: Los enlaces eran material de la catedra, falso positivo.
                resolved_at: '2026-09-18T20:51:03.687825741Z'
                status: REVERSED
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /operations/retention-policy/moderation:
    get:
      tags: [Retención (admin)]
      operationId: leerPoliticaRetencion
      summary: Días de retención de evidencia por tipo de incidente
      responses:
        '200':
          description: Mapa tipo -> días
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: integer } }
    put:
      tags: [Retención (admin)]
      operationId: actualizarPoliticaRetencion
      summary: Un ADMIN cambia la retención sin redespliegue
      parameters:
        - $ref: '#/components/parameters/PrincipalType'
        - $ref: '#/components/parameters/UserId'
        - { name: X-User-Roles, in: header, required: true, schema: { type: string, example: ADMIN } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Política vigente
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: integer } }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    GatewayHeaders:
      type: apiKey
      in: header
      name: X-Principal-Type
      description: |
        Headers inyectados por el API Gateway. Servicio: `X-Principal-Type: service`, `X-Service-Id`,
        `X-Service-Scopes: moderation:decide`. Usuario: `X-Principal-Type: user`, `X-User-Id`, `X-User-Roles`
        (docente además `X-Teacher-Course-Ids: curso-42,curso-43`). Sin headers: 401.
  parameters:
    PrincipalType: { name: X-Principal-Type, in: header, required: true, schema: { type: string, enum: [service, user] } }
    ServiceId: { name: X-Service-Id, in: header, required: true, schema: { type: string, example: chat-service } }
    ServiceScopes: { name: X-Service-Scopes, in: header, required: true, schema: { type: string, example: 'moderation:decide' } }
    UserId: { name: X-User-Id, in: header, required: true, schema: { type: string, example: alumno-1 } }
    UserRoles: { name: X-User-Roles, in: header, required: false, schema: { type: string, example: STUDENT } }
    TeacherCourseIds: { name: X-Teacher-Course-Ids, in: header, required: false, description: Cursos asignados al docente, schema: { type: string, example: 'curso-42' } }
  responses:
    BadRequest:
      description: Payload inválido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Bad Request, status: 400, detail: Los datos enviados no son válidos o contienen campos obligatorios ausentes., error: validation_error }
    Unauthorized:
      description: Sin identidad o sin el scope requerido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            sinHeaders: { value: { type: 'https://tpi.utn.frc/errors/no-autenticado', title: No autenticado, status: 401, detail: El request no trae headers de identidad validados. } }
            scopeFaltante: { value: { type: about:blank, title: Unauthorized, status: 401, detail: 'Missing scope: moderation:decide' } }
    Forbidden:
      description: No es dueño del recurso / no es docente del curso / no es ADMIN
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Forbidden, status: 403, detail: No sos docente del curso curso-99, error: forbidden }
    NotFound:
      description: No existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Not Found, status: 404, detail: 'Incidente no encontrado' }
  schemas:
    ModerationDecisionRequest:
      type: object
      required: [message_id, course_id, sender_id, sender_role, text]
      properties:
        message_id: { type: string, description: Clave de idempotencia }
        course_id: { type: string }
        sender_id: { type: string, maxLength: 255, description: 'Id del usuario que escribió el mensaje. NUEVO v1.1.0; dueño del incidente.' }
        sender_role: { type: string, example: student, description: 'student | teacher | system' }
        text: { type: string, minLength: 1, maxLength: 4096 }
        context_flags: { type: object, additionalProperties: true, description: Solo contexto inmediato, nunca historial }
    ModerationDecisionResponse:
      type: object
      required: [message_id, decision, reason_code, classifier_used, latency_ms, incident_id]
      properties:
        message_id: { type: string }
        decision: { type: string, enum: [ALLOW, BLOCK, PENDING, PENDING_REVIEW] }
        reason_code: { type: string, example: SPAM, description: 'CLEAN, SPAM, OFFENSIVE, CODE_OBFUSCATION, NEEDS_REVIEW, ENGINE_UNAVAILABLE…' }
        classifier_used: { type: string, enum: [deterministic, contextual, fallback] }
        latency_ms: { type: integer, format: int64 }
        incident_id: { type: string, format: uuid, nullable: true, description: 'Presente si decision != ALLOW' }
        degradation_reason: { type: string, description: 'Solo en modo degradado: CONTEXTUAL_UNAVAILABLE | FULL_ENGINE_UNAVAILABLE' }
    CreateAppealRequest:
      type: object
      required: [incident_id, appeal_reason]
      properties:
        incident_id: { type: string, format: uuid }
        appeal_reason: { type: string, minLength: 20, maxLength: 1000 }
    Appeal:
      type: object
      properties:
        appeal_id: { type: string, format: uuid }
        incident_id: { type: string, format: uuid }
        user_id: { type: string }
        appeal_reason: { type: string }
        status: { type: string, enum: [PENDING_REVIEW, CONFIRMED, REVERSED] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IncidentSummary:
      type: object
      properties:
        incident_id: { type: string, format: uuid }
        message_preview: { type: string, maxLength: 200 }
        reason_code: { type: string }
        decision: { type: string }
        created_at: { type: string, format: date-time }
        has_appeal: { type: boolean }
        appeal_reason: { type: string, nullable: true }
        course_id: { type: string }
        status: { type: string, enum: [BLOCK, PENDING_REVIEW, CONFIRMED, REVERSED] }
    IncidentPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/IncidentSummary' } }
        page: { type: integer }
        size: { type: integer }
        total_elements: { type: integer, format: int64 }
        total_pages: { type: integer }
    IncidentDetail:
      type: object
      properties:
        incident_id: { type: string, format: uuid }
        reason_code: { type: string }
        resolution: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        content: { type: string, nullable: true, description: Nulo si la evidencia fue purgada }
        course_id: { type: string }
        status: { type: string }
        has_appeal: { type: boolean }
        appeal_reason: { type: string, nullable: true }
    ResolveRequest:
      type: object
      required: [resolution, resolution_reason]
      properties:
        resolution: { type: string, enum: [CONFIRMED, REVERSED] }
        resolution_reason: { type: string, minLength: 20, maxLength: 500 }
    Resolution:
      type: object
      properties:
        incident_id: { type: string, format: uuid }
        resolution: { type: string, enum: [CONFIRMED, REVERSED] }
        resolved_by: { type: string }
        resolution_reason: { type: string }
        resolved_at: { type: string, format: date-time }
        status: { type: string }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        requestId: { type: string }
        error: { type: string }

# Esqueleto AsyncAPI 3.0 — un canal por tópico; un tópico agrupa varios eventType.
# Envelope de cinco campos (KAFKA.pdf); la correlación (traceparent, X-Request-Id) viaja en HEADERS.
# Los tópicos los asigna Notificaciones: hasta entonces, x-topic-status: pending-assignment.
asyncapi: 3.0.0
info:
  title: <N> Service Kafka Events
  version: 1.0.0
  description: >
    Eventos asíncronos de <n>-service. Estándar KAFKA.pdf: envelope {eventId, eventType, timestamp,
    producer, payload} sin eventVersion, eventType en MAYUSCULAS_CON_GUION_BAJO, todo en ingles.
    La correlación viaja en headers traceparent y X-Request-Id.
servers:
  eventBus:
    host: event-bus:29092
    protocol: kafka
channels:
  <topico_que_publica>:
    address: <topico_que_publica>
    x-topic-status: pending-assignment      # quitar cuando Notificaciones lo asigne
    messages:
      <evento>: { $ref: '#/components/messages/<Evento>' }
  <topico_que_consume>:
    address: <topico_que_consume>
    x-topic-status: pending-assignment
    messages:
      <evento>: { $ref: '#/components/messages/<EventoEntrante>' }
operations:
  publish<Evento>:   { action: send,    channel: { $ref: '#/channels/<topico_que_publica>' } }
  consume<Evento>:   { action: receive, channel: { $ref: '#/channels/<topico_que_consume>' } }
components:
  messages:
    <Evento>:        { payload: { $ref: '#/components/schemas/<Payload>' } }
    <EventoEntrante>: { payload: { $ref: '#/components/schemas/<PayloadEntrante>' } }
  schemas:
    Envelope:
      type: object
      required: [eventId, eventType, timestamp, producer, payload]
      additionalProperties: false
      properties:
        eventId:   { type: string, format: uuid }        # idempotencia: reprocesar no duplica
        eventType: { type: string }                      # MAYUSCULAS_CON_GUION_BAJO, hecho ya ocurrido
        timestamp: { type: string, format: date-time }   # ISO-8601 UTC
        producer:  { type: string }                      # nombre del microservicio
        payload:   { type: object }
    <Payload>:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            eventType: { const: <EVENT_TYPE_EN_INGLES> }
            payload:
              type: object
              required: [ <campos obligatorios del evento> ]
              properties: {}
    <PayloadEntrante>:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload: { type: object }
